name: Reproduce sized deallocation crash

on: [push, pull_request]

jobs:
  reproduce-crash:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "clang-22 (sized dealloc ON — should CRASH)"
            cxx: clang++-22
            extra_cxx_flags: ""
          - name: "clang-22 (sized dealloc OFF — workaround)"
            cxx: clang++-22
            extra_cxx_flags: "-fno-sized-deallocation"

    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-22
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22

      - name: Install build deps
        run: sudo apt-get install -y cmake python3-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_CXX_FLAGS="${{ matrix.extra_cxx_flags }}" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Verify sized deallocation status
        run: |
          echo '#include <iostream>
          int main() {
          #ifdef __cpp_sized_deallocation
            std::cout << "__cpp_sized_deallocation = " << __cpp_sized_deallocation << std::endl;
          #else
            std::cout << "__cpp_sized_deallocation is NOT defined" << std::endl;
          #endif
          }' | ${{ matrix.cxx }} -std=c++20 ${{ matrix.extra_cxx_flags }} -x c++ - -o /tmp/check && /tmp/check

      - name: Run reproducer
        run: PYTHONPATH=build python3 test_crash.py
